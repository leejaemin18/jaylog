name: 워드프레스 예약발행 깨우기

# 워드프레스 예약발행(wp-cron)은 사이트에 방문이 있어야 작동한다.
# 새 블로그는 방문자가 없어 예약글이 제때 안 올라가는 문제가 있으므로,
# GitHub 클라우드가 매시간 사이트를 한 번씩 두드려 예약발행을 깨운다.
# 비밀키 불필요 — 일반 방문과 동일한 요청이며, PC가 꺼져 있어도 동작한다.

on:
  schedule:
    # GitHub가 스케줄 실행을 자주 건너뛰므로(실측: 하루 1~2회만 실행됨) 시간당 3회로 촘촘하게 건다.
    # UTC 기준 매시 7/27/47분 (한국시간 08시~23시대)
    - cron: "7,27,47 23,0-14 * * *"
  workflow_dispatch: {}   # 수동 실행 버튼도 제공

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: wp-cron 호출 (예약발행 트리거)
        run: |
          curl -s -m 30 -o /dev/null -w "wp-cron ping: HTTP %{http_code}\n" \
            "https://jaylog.co.kr/wp-cron.php?doing_wp_cron" || true
          curl -s -m 30 -o /dev/null -w "homepage ping: HTTP %{http_code}\n" \
            "https://jaylog.co.kr/" || true

      - name: 밀린 예약글 강제 발행 (wp-cron 불발 대비)
        env:
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: |
          python3 - <<'PYEOF'
          import os, json, base64, datetime, urllib.request
          PW = os.environ.get("WP_APP_PASSWORD", "")
          if not PW:
              print("WP_APP_PASSWORD 없음 — 건너뜀"); raise SystemExit(0)
          AUTH = base64.b64encode(f"claude:{PW}".encode()).decode()
          API = "https://jaylog.co.kr/wp-json/wp/v2"
          def req(p, m="GET", d=None):
              r = urllib.request.Request(API + p, method=m,
                  headers={"Authorization": "Basic " + AUTH, "Content-Type": "application/json"},
                  data=json.dumps(d).encode() if d else None)
              with urllib.request.urlopen(r, timeout=30) as res:
                  return json.load(res)
          now = datetime.datetime.now(datetime.timezone.utc)
          late = 0
          for p in req("/posts?status=future&per_page=50&_fields=id,title,date_gmt"):
              due = datetime.datetime.fromisoformat(p["date_gmt"]).replace(tzinfo=datetime.timezone.utc)
              if due <= now:
                  r = req(f"/posts/{p['id']}", "POST", {"status": "publish"})
                  late += 1
                  print(f"⏰ 밀린 예약글 강제 발행: id {p['id']} | {r['title']['rendered'][:40]}")
          print(f"강제 발행 {late}건" if late else "밀린 예약글 없음")
          PYEOF
