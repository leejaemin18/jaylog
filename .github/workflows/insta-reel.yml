name: 인스타 릴스 — 제이로그 (이미지→영상+음악)

on:
  workflow_dispatch:
    inputs:
      image:
        description: "drafts/img/<이름> (확장자 없이) — 릴스 배경으로 쓸 카드 이미지"
        required: true
        default: ""
      caption:
        description: "캡션(본문 + 해시태그). 링크는 프로필로 안내"
        required: false
        default: ""
      duration:
        description: "릴스 길이(초)"
        required: false
        default: "8"
      music_file:
        description: "배경음악 파일명(effacestudios CC0 팩). 예: Party Time.mp3 / The Champion.mp3 / Sports Spirit.mp3 / Newness.mp3"
        required: false
        default: "Party Time.mp3"
      music_start:
        description: "곡에서 사용할 시작 지점(초)"
        required: false
        default: "8"

jobs:
  reel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 도구 준비
        run: |
          pip install --quiet requests
          ffmpeg -version >/dev/null 2>&1 || sudo apt-get update -y && sudo apt-get install -y ffmpeg
      - name: 릴스 렌더링 (9:16 + 실제 로열티프리 음악)
        env:
          IMG: ${{ inputs.image }}
          DUR: ${{ inputs.duration }}
          MUSIC: ${{ inputs.music_file }}
          MSTART: ${{ inputs.music_start }}
        run: |
          set -e
          SRC=$(ls drafts/img/${IMG}.jpg drafts/img/${IMG}.jpeg drafts/img/${IMG}.png 2>/dev/null | head -1)
          if [ -z "$SRC" ]; then echo "❌ 이미지 없음: drafts/img/${IMG}.*"; exit 1; fi
          OUTFADE=$(python3 -c "print(max(0,float('${DUR}')-1))")
          # 1) 실제 CC0(퍼블릭 도메인) 음악을 내려받는다 — effacestudios/Royalty-Free-Music-Pack
          ENC=$(python3 -c "import urllib.parse,os;print(urllib.parse.quote(os.environ['MUSIC']))")
          URL="https://raw.githubusercontent.com/effacestudios/Royalty-Free-Music-Pack/master/${ENC}"
          echo "음악 다운로드: $URL"
          if curl -fsSL "$URL" -o music.mp3 && [ "$(stat -c%s music.mp3 2>/dev/null || echo 0)" -gt 100000 ]; then
            AUDIO=music.mp3; SS="-ss ${MSTART}"
            echo "✅ 실제 음악 사용: ${MUSIC} (시작 ${MSTART}s)"
          else
            echo "⚠️ 음악 다운로드 실패 → 합성 폴백"
            pip install --quiet numpy
            python3 .github/scripts/make_music.py audio.wav "${DUR}"
            AUDIO=audio.wav; SS=""
          fi
          # 2) 9:16 릴스: 흐린 배경 + 카드 중앙 배치, 음악 페이드 인/아웃
          ffmpeg -y -loop 1 -i "$SRC" $SS -i "$AUDIO" \
            -filter_complex "[0:v]scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,boxblur=20:1,eq=brightness=-0.2[bg];[0:v]scale=1000:1000[fg];[bg][fg]overlay=(W-w)/2:(H-h)/2,format=yuv420p[v]" \
            -map "[v]" -map 1:a \
            -af "afade=t=in:st=0:d=0.8,afade=t=out:st=${OUTFADE}:d=1,volume=1.0" \
            -c:v libx264 -preset medium -crf 20 -pix_fmt yuv420p -r 25 -t "${DUR}" \
            -c:a aac -b:a 160k -movflags +faststart -shortest reel.mp4
          ls -la reel.mp4
      - name: 릴스 게시
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_GRAPH_HOST: ${{ vars.IG_GRAPH_HOST }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          CAPTION: ${{ inputs.caption }}
        run: |
          python .github/scripts/insta_upload.py \
            --media-type REELS \
            --local-video reel.mp4 \
            --caption "$CAPTION"
