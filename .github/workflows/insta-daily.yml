name: 인스타 백로그 하루 3개 자동 발행

# research/insta-backlog-queue.md 의 미발행([완료] 없는) 항목을 하루 최대 3개 인스타에 올린다.
# 캡션은 파일의 한글을 그대로 사용(오타 원천 차단). 성공분만 [완료] 표시 후 커밋.
# 필요 시크릿: IG_USER_ID, IG_ACCESS_TOKEN, WP_APP_PASSWORD
# 매일 00:00 UTC(=09:00 KST). 수동 실행도 가능.

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      max:
        description: "오늘 올릴 최대 개수 (기본 3)"
        required: false
        default: "3"

concurrency:
  group: insta-daily
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: 파이썬 준비
        run: pip install --quiet requests
      - name: 백로그 하루치 발행
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_GRAPH_HOST: ${{ vars.IG_GRAPH_HOST }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          DAILY_MAX: ${{ inputs.max || '3' }}
        run: python3 .github/scripts/insta_daily.py
      - name: 완료 표시 커밋
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add research/insta-backlog-queue.md
          git diff --cached --quiet && { echo "변경 없음"; exit 0; }
          git commit -m "인스타 백로그: 하루치 발행 완료 표시 [bot]"
          for i in 1 2 3 4; do
            git pull --rebase origin main && git push origin main && exit 0
            git rebase --abort 2>/dev/null || true; sleep $((2**i))
          done
          echo "::error::푸시 실패"; exit 1
