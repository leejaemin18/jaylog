name: 사이트 전체 백업

# 서버 이전·해지 전에 블로그 자료를 통째로 받아 둔다.
# 결과(콘텐츠 JSON·미디어 원본·사이트 HTML 사본)는 저장소에 커밋하지 않고 아티팩트로만 남긴다(댓글 등 개인정보).

on:
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: 콘텐츠·미디어 내보내기
        env:
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: python3 .github/scripts/site_backup.py

      - name: 사이트 전체 HTML 사본 (wget)
        run: |
          mkdir -p backup/mirror && cd backup/mirror
          wget --mirror --page-requisites --adjust-extension --convert-links \
               --no-parent -e robots=off --wait=0.2 --tries=2 --timeout=30 \
               --reject-regex '(\?replytocom=|/feed/|/wp-json/|xmlrpc|/wp-admin/|\?s=)' \
               -U "jaylog-backup" https://jaylog.co.kr/ || true
          cd ../..
          echo "HTML 사본 파일 수: $(find backup/mirror -type f | wc -l)"

      - name: 묶기
        run: |
          d=$(date -u +%Y%m%d)
          cd backup
          zip -qr ../jaylog-content-$d.zip content
          zip -qr ../jaylog-media-$d.zip media
          zip -qr ../jaylog-mirror-$d.zip mirror
          cd ..
          ls -la jaylog-*.zip

      - uses: actions/upload-artifact@v4
        with:
          name: jaylog-backup
          path: jaylog-*.zip
          retention-days: 7
