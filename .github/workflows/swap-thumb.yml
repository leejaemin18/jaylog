name: 대표 썸네일 교체(로컬 이미지)

# 저장소에 커밋해둔 로컬 이미지 파일을 워드프레스 미디어로 올리고
# 지정한 글의 대표(썸네일) 이미지로 설정한다. OpenAI API 미사용(비용 0).
# 폰/브라우저에서 Run workflow → post_id, image 입력.
# 필요한 시크릿: WP_APP_PASSWORD

on:
  workflow_dispatch:
    inputs:
      post_id:
        description: "대상 글 번호"
        required: true
      image:
        description: "대표(썸네일) 로컬 이미지 경로 (예: drafts/img/xxx-thumb.png)"
        required: false
      body_image:
        description: "본문 이미지 경로 (선택, 예: drafts/img/xxx-body.png)"
        required: false
      body_anchor:
        description: "이 문구가 든 소제목(h2) 앞에 본문 이미지 삽입 (선택)"
        required: false
      body_alt:
        description: "본문 이미지 alt (선택)"
        required: false
      move_src:
        description: "재배치 모드: 이미 삽입된 본문 figure의 파일명 일부. body_anchor h2 앞으로 옮기고 alt 교정 (선택)"
        required: false
      new_title:
        description: "글 제목 변경 (선택, 포커스 키워드 앞배치 등)"
        required: false

jobs:
  swap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pillow
      - name: 대표 썸네일 교체
        env:
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          POST_ID: ${{ inputs.post_id }}
          IMAGE: ${{ inputs.image }}
          BODY_IMAGE: ${{ inputs.body_image }}
          BODY_ANCHOR: ${{ inputs.body_anchor }}
          BODY_ALT: ${{ inputs.body_alt }}
          MOVE_SRC: ${{ inputs.move_src }}
          NEW_TITLE: ${{ inputs.new_title }}
        run: python3 .github/scripts/swap_thumb.py
