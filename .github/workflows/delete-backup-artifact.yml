name: 백업 아티팩트 삭제

# site-backup.yml이 남긴 백업(jaylog-backup)을 사용자가 내려받은 뒤 GitHub에서 지운다.

on:
  workflow_dispatch:

permissions:
  actions: write

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: jaylog-backup 아티팩트 전부 삭제
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ids=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=jaylog-backup&per_page=100" --jq '.artifacts[].id')
          if [ -z "$ids" ]; then echo "지울 백업 없음"; exit 0; fi
          for id in $ids; do
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id" && echo "삭제: $id"
          done
