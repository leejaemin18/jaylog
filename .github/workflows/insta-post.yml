name: 인스타 게시 — 제이로그

on:
  workflow_dispatch:
    inputs:
      image_url:
        description: "게시할 이미지 공개 URL (직접 URL이 있을 때)"
        required: false
        default: ""
      local_image:
        description: "drafts/img/<이름> (확장자 없이). WP 미디어에 올려 공개 URL로 게시"
        required: false
        default: ""
      video_url:
        description: "게시할 영상 공개 URL (REELS일 때 필수)"
        required: false
        default: ""
      caption:
        description: "캡션(본문 + 해시태그). 링크는 프로필로 안내(피드 캡션 링크는 클릭 안 됨)"
        required: false
        default: ""
      media_type:
        description: "미디어 종류"
        required: true
        default: "IMAGE"
        type: choice
        options:
          - IMAGE
          - REELS
      verify_only:
        description: "게시하지 않고 계정·최근 게시물만 확인"
        required: false
        default: false
        type: boolean

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 파이썬 준비
        run: pip install --quiet requests
      - name: 인스타 게시
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_GRAPH_HOST: ${{ vars.IG_GRAPH_HOST }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: |
          python .github/scripts/insta_upload.py \
            ${{ inputs.verify_only == true && '--verify' || '' }} \
            --media-type "${{ inputs.media_type }}" \
            --image-url "${{ inputs.image_url }}" \
            --local-image "${{ inputs.local_image }}" \
            --video-url "${{ inputs.video_url }}" \
            --caption "${{ inputs.caption }}"
