name: 주제 검색 수요 조사

# 후보 키워드별 검색 수요(데이터랩 검색량 지수 + 지식iN·블로그·카페 누적 건수)를 한 표로 뽑아
# research/검색량-*.md 로 커밋한다. 키워드를 비워두면 research/topic-keywords.txt 를 쓴다.
# 필요한 시크릿: NAVER_CLIENT_ID, NAVER_CLIENT_SECRET (데이터랩 권한이 없으면 지수만 생략)

on:
  workflow_dispatch:
    inputs:
      keywords:
        description: "조사할 키워드 (쉼표 구분, 비우면 topic-keywords.txt)"
        required: false
        default: ""

jobs:
  volume:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: 검색 수요 측정
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          KEYWORDS: ${{ inputs.keywords }}
        run: python3 .github/scripts/topic_volume.py
      - name: 결과 커밋
        run: |
          git config user.name "jaylog-bot"
          git config user.email "actions@github.com"
          git add research/
          git diff --cached --quiet && { echo "변경 없음"; exit 0; }
          git commit -m "주제 검색 수요 조사 결과 [bot]"
          for i in 1 2 3 4; do
            git pull --rebase origin main && git push origin main && exit 0
            git rebase --abort 2>/dev/null || true; sleep $((2**i))
          done
          echo "::error::푸시 실패"; exit 1
