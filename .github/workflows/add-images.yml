name: 텍스트 등록글에 이미지 채우기

# 크레딧 소진으로 '썸네일 필요' 상태로 등록된 글에 나중에 이미지를 채운다.
# Run workflow → file 칸에 published/<슬러그>.md 경로 입력.
# 필요한 시크릿: WP_APP_PASSWORD, OPENAI_API_KEY

on:
  workflow_dispatch:
    inputs:
      file:
        description: "published/<슬러그>.md 경로"
        required: true
        type: string

jobs:
  add-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml pillow
      - name: 이미지 생성·삽입
        env:
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FILE: ${{ inputs.file }}
        run: |
          if [ -z "$WP_APP_PASSWORD" ] || [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::WP_APP_PASSWORD / OPENAI_API_KEY 시크릿이 필요합니다."
            exit 1
          fi
          python3 .github/scripts/add_images.py
