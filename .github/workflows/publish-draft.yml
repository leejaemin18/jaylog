name: 초안 자동 등록 — 썸네일 생성 + 워드프레스 예약

# drafts/ 폴더에 초안(md)이 올라오면 클라우드가 자동으로:
#   1) 초안의 썸네일 브리프로 OpenAI 이미지 생성
#   2) 워드프레스에 업로드 + 글 등록 (하루 1개씩 예약 큐 맨 뒤에)
#   3) 처리한 초안을 published/ 폴더로 이동
# 필요한 시크릿: WP_APP_PASSWORD (이미지는 드라이브 로컬 파일만 사용 — OpenAI API 미호출)
# (Settings > Secrets and variables > Actions 에 등록)

on:
  push:
    branches: [main]
    paths: ["drafts/**.md"]
  workflow_dispatch: {}

concurrency:
  group: publish-draft
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 준비물 설치
        run: pip install --quiet pyyaml pillow

      - name: AI 티 게이트 (발행 전 점검 — 비차단 경고)
        run: python3 .github/scripts/humanize_gate.py

      - name: 초안 처리
        env:
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: |
          # 이미지는 드라이브(OpenAI Plus)로 받은 로컬 파일만 사용. OpenAI 이미지 API는 호출하지 않는다(사용자 지시 2026-08-20).
          if [ -z "$WP_APP_PASSWORD" ]; then
            echo "::error::WP_APP_PASSWORD 시크릿을 먼저 등록하세요."
            exit 1
          fi
          python3 .github/scripts/publish_draft.py

      - name: 처리 결과 커밋
        run: |
          git config user.name "jaylog-bot"
          git config user.email "actions@github.com"
          git add -A
          git diff --cached --quiet && { echo "커밋할 변경 없음"; exit 0; }
          git commit -m "자동 처리: 초안 등록 완료 [bot]"
          # 다른 커밋(수동/다른 워크플로)과 충돌해도 rebase 후 재시도 —
          # 초안이 published/로 확실히 옮겨져야 다음 실행 때 중복 등록을 막는다.
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin main && { echo "푸시 완료"; exit 0; }
            echo "::warning::푸시 충돌, 재시도 $i"; git rebase --abort 2>/dev/null || true; sleep $((2**i))
          done
          echo "::error::푸시 최종 실패 — 초안이 이미 WP에 등록됐을 수 있으니 drafts/ 상태를 수동 확인하세요."
          exit 1
